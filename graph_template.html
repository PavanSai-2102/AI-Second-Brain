<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecondSelf — Knowledge Graph</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script src="graph.js"></script>
    <style>
        :root {
            --bg-gradient-start: #0a0a0a;
            --bg-gradient-end: #000000;
            --text-color: #f8fafc;
            --panel-bg: rgba(20, 20, 20, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            
            --projects-color: #3B82F6;
            --areas-color: #10B981;
            --resources-color: #FF5252;
            --archives-color: #F59E0B;
        }
        
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-gradient-end);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #cy {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            z-index: 10;
            background-color: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        #tooltip {
            top: 16px;
            left: 16px;
            width: 300px;
            display: none;
            transition: opacity 0.2s ease;
        }

        #tooltip h2 {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.3;
            color: #ffffff;
        }

        #tooltip .meta {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        #tooltip .summary {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 16px;
            color: #ccc;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }

        .tag {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            color: #aaa;
        }

        #controls {
            bottom: 16px;
            left: 16px;
            display: flex;
            gap: 8px;
        }

        button {
            background-color: rgba(255, 255, 255, 0.05);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="loading">Building Knowledge Graph...</div>
    <div id="cy"></div>

    <div id="tooltip" class="overlay">
        <h2 id="tt-title">Note Title</h2>
        <div class="meta">
            <span id="tt-date">Date</span>
            <span id="tt-links">0 connections</span>
        </div>
        <div id="tt-summary" class="summary">Summary goes here.</div>
        <div id="tt-tags" class="tags-container"></div>
    </div>

    <div id="controls" class="overlay">
        <button id="btn-fit">Fit View</button>
        <button id="btn-layout">Re-run Layout</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof graphData !== 'undefined') {
                initGraph(graphData);
            } else {
                document.getElementById('loading').innerHTML = `Error loading graph data`;
            }

            function initGraph(graphData) {
                document.getElementById('loading').style.display = 'none';
                if (graphData.nodes.length === 0) {
                    document.getElementById('loading').style.display = 'block';
                    document.getElementById('loading').innerHTML = `Graph is empty`;
                    return;
                }

                const categoryColors = {
                    'projects': '#3B82F6',
                    'areas': '#10B981',
                    'resources': '#FF5252',
                    'archives': '#F59E0B'
                };

                const cyElements = [];
                const nodeColorMap = {};
                const nodeCategoryMap = {};
                
                graphData.nodes.forEach(n => {
                    const nodeColor = categoryColors[n.category] || '#94a3b8';
                    nodeColorMap[n.id] = nodeColor;
                    nodeCategoryMap[n.id] = n.category || 'archives';
                    
                    cyElements.push({
                        group: 'nodes',
                        data: {
                            id: n.id,
                            label: n.label,
                            full_title: n.full_title,
                            category: n.category,
                            summary: n.summary,
                            tags: n.tags,
                            created: n.created,
                            link_count: n.link_count || 0
                        }
                    });
                });
                
                graphData.edges.forEach(e => {
                    const sColor = nodeColorMap[e.source] || '#475569';
                    const tColor = nodeColorMap[e.target] || '#475569';
                    
                    cyElements.push({
                        group: 'edges',
                        data: {
                            source: e.source,
                            target: e.target,
                            similarity: e.similarity,
                            source_color: sColor,
                            target_color: tColor,
                            gradient_colors: `${sColor} ${tColor}`
                        }
                    });
                });

                const cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: cyElements,
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'label': 'data(label)',
                                'color': '#888',
                                'text-valign': 'bottom',
                                'text-margin-y': 6,
                                'font-size': '10px',
                                'width': 'mapData(link_count, 0, 10, 16, 36)',
                                'height': 'mapData(link_count, 0, 10, 16, 36)',
                                'border-width': 1.5,
                                'border-color': 'rgba(255, 255, 255, 0.4)',
                                'shadow-blur': 15,
                                'shadow-opacity': 0.8,
                                'shadow-color': '#fff'
                            }
                        },
                        { selector: 'node[category = "projects"]', style: { 'background-color': '#3B82F6', 'shadow-color': '#3B82F6' } },
                        { selector: 'node[category = "areas"]', style: { 'background-color': '#10B981', 'shadow-color': '#10B981' } },
                        { selector: 'node[category = "resources"]', style: { 'background-color': '#FF5252', 'shadow-color': '#FF5252' } },
                        { selector: 'node[category = "archives"]', style: { 'background-color': '#F59E0B', 'shadow-color': '#F59E0B' } },
                        {
                            selector: 'edge',
                            style: {
                                'width': 'mapData(similarity, 0.3, 1.0, 1.5, 4)',
                                'curve-style': 'bezier',
                                'line-color': 'data(source_color)',
                                'line-fill': 'linear-gradient',
                                'line-gradient-stop-colors': 'data(gradient_colors)',
                                'line-gradient-stop-positions': '0 100',
                                'opacity': 0.6
                            }
                        },
                        { selector: 'node.highlight', style: { 'border-width': 3, 'border-color': '#ffffff', 'shadow-blur': 25, 'shadow-color': '#ffffff', 'color': '#ffffff' } },
                        { selector: 'node.dim', style: { 'opacity': 0.15 } },
                        { selector: 'edge.highlight', style: { 'opacity': 0.9, 'width': 'mapData(similarity, 0.3, 1.0, 2.5, 6)', 'line-color': 'data(target_color)' } },
                        { selector: 'edge.dim', style: { 'opacity': 0.05 } }
                    ],
                    layout: { name: 'cose', animate: cyElements.length < 150, animationDuration: 1000, nodeRepulsion: 400000, idealEdgeLength: 100, edgeElasticity: 100, nestingFactor: 5, gravity: 250, padding: 30 }
                });

                cy.on('mouseover', 'node', function(e) {
                    const data = e.target.data();
                    document.getElementById('tt-title').textContent = data.full_title;
                    document.getElementById('tt-date').textContent = data.created ? new Date(data.created).toLocaleDateString() : 'Unknown date';
                    document.getElementById('tt-links').textContent = `${data.link_count} connections`;
                    document.getElementById('tt-summary').textContent = data.summary || "No summary available.";
                    
                    const tagsContainer = document.getElementById('tt-tags');
                    tagsContainer.innerHTML = '';
                    (data.tags || []).forEach(tag => {
                        const span = document.createElement('span');
                        span.className = 'tag'; span.textContent = '#' + tag;
                        tagsContainer.appendChild(span);
                    });
                    
                    document.getElementById('tooltip').style.display = 'block';
                    document.getElementById('cy').style.cursor = 'pointer';
                });

                cy.on('mouseout', 'node', function(e) {
                    document.getElementById('tooltip').style.display = 'none';
                    document.getElementById('cy').style.cursor = 'default';
                });

                cy.on('tap', 'node', function(e) {
                    const node = e.target;
                    cy.elements().removeClass('highlight dim');
                    const neighborhood = node.neighborhood();
                    cy.elements().difference(neighborhood).not(node).addClass('dim');
                    node.addClass('highlight');
                    neighborhood.addClass('highlight');
                });
                
                cy.on('tap', function(e) {
                    if (e.target === cy) cy.elements().removeClass('highlight dim');
                });

                document.getElementById('btn-fit').addEventListener('click', () => cy.animate({ fit: { padding: 50 }, duration: 500 }));
                document.getElementById('btn-layout').addEventListener('click', () => cy.layout({ name: 'cose', animate: true, nodeRepulsion: 400000, idealEdgeLength: 100, edgeElasticity: 100, nestingFactor: 5, gravity: 250, padding: 30 }).run());
            }
        });
    </script>
</body>
</html>
